name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Ekstrak zip
        run: |
          for z in *.zip; do if [ -f "$z" ]; then unzip -oq "$z" -d extracted; fi; done
      - name: Cari project
        id: p
        run: |
          f=$(find . -name build.gradle -not -path './.git/*' | head -n1)
          [ -z "$f" ] && { echo 'build.gradle tidak ditemukan'; exit 1; }
          echo "dir=$(dirname "$f")" >> $GITHUB_OUTPUT
      - name: Build
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: omniai_assistant-jar
          path: ${{ steps.p.outputs.dir }}/build/libs/*.jar
      - name: Rilis jar
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: ${{ steps.p.outputs.dir }}/build/libs/*.jar
